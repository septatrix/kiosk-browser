name: Build Raspberry Pi OS arm64 binaries

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.artifact_label }} (${{ matrix.arch_label }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_label: bookworm
            arch_label: arm64
            distro: debian
            runs_on: ubuntu-24.04-arm
            container_image: debian:bookworm
            package_generator: DEB
            package_extension: deb
          - artifact_label: trixie
            arch_label: arm64
            distro: debian
            runs_on: ubuntu-24.04-arm
            container_image: debian:trixie
            package_generator: DEB
            package_extension: deb
          - artifact_label: fedora43
            arch_label: x86_64
            distro: fedora
            runs_on: ubuntu-24.04
            container_image: fedora:43
            package_generator: RPM
            package_extension: rpm
          - artifact_label: fedora44
            arch_label: x86_64
            distro: fedora
            runs_on: ubuntu-24.04
            container_image: fedora:44
            package_generator: RPM
            package_extension: rpm
    container:
      image: ${{ matrix.container_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update
          # Keep ordering aligned with Fedora. dpkg-dev/fakeroot are Debian-specific packaging tools.
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            cmake \
            ninja-build \
            file \
            pkg-config \
            build-essential \
            dpkg-dev \
            fakeroot \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-virtualkeyboard-dev \
            qt6-webengine-dev

      - name: Install build dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          # Match apt's metadata refresh and optional-dependency behavior.
          # rpm-build mirrors Debian's packaging tools; findutils provides GNU find in minimal Fedora images.
          dnf -y --refresh --setopt=install_weak_deps=False install \
            bash \
            ca-certificates \
            cmake \
            ninja-build \
            file \
            pkgconf-pkg-config \
            gcc-c++ \
            make \
            rpm-build \
            findutils \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtvirtualkeyboard-devel \
            qt6-qtwebengine-devel

      - name: Build and package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "${GITHUB_REF_NAME}" ]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_GENERATOR=${{ matrix.package_generator }} \
            -DCPACK_PACKAGE_VERSION="${VERSION}"

          cmake --build build --parallel
          DESTDIR="${PWD}/stage" cmake --install build
          cpack --config build/CPackConfig.cmake -G ${{ matrix.package_generator }} -B build/packages

          mapfile -t MATCHED_BINARIES < <(find stage/usr/bin -maxdepth 1 -type f -name '*kiosk-browser*' -executable)
          if [ "${#MATCHED_BINARIES[@]}" -ne 1 ]; then
            printf '%s\n' "Error: expected exactly one kiosk-browser executable in stage/usr/bin, found ${#MATCHED_BINARIES[@]}"
            printf '%s\n' "${MATCHED_BINARIES[@]}"
            exit 1
          fi
          cp "${MATCHED_BINARIES[0]}" "build/kiosk-browser-${{ matrix.artifact_label }}-${{ matrix.arch_label }}"

      - name: Upload raw binary
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-browser-${{ matrix.artifact_label }}-${{ matrix.arch_label }}-binary
          path: build/kiosk-browser-${{ matrix.artifact_label }}-${{ matrix.arch_label }}

      - name: Upload package artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-browser-${{ matrix.artifact_label }}-${{ matrix.arch_label }}-${{ matrix.package_extension }}
          path: build/packages/*.${{ matrix.package_extension }}
