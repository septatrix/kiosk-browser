name: Build Raspberry Pi OS arm64 binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.rpios_release }} (arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        rpios_release: [bookworm, trixie]
    container:
      image: debian:${{ matrix.rpios_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            dpkg-dev \
            fakeroot \
            file \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-virtualkeyboard-dev \
            qt6-webengine-dev

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "${GITHUB_REF_NAME}" ]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_GENERATOR=DEB \
            -DCPACK_PACKAGE_VERSION="${VERSION}" \
            -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64

          cmake --build build --parallel
          DESTDIR="${PWD}/stage" cmake --install build
          cpack --config build/CPackConfig.cmake -G DEB -B build/packages

          APP_BINARY="$(find stage/usr/bin -maxdepth 1 -type f -executable | head -n 1)"
          test -n "${APP_BINARY}"
          cp "${APP_BINARY}" "build/kiosk-browser-${{ matrix.rpios_release }}-arm64"

      - name: Upload raw binary
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-browser-${{ matrix.rpios_release }}-arm64-binary
          path: build/kiosk-browser-${{ matrix.rpios_release }}-arm64

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-browser-${{ matrix.rpios_release }}-arm64-deb
          path: build/packages/*.deb
