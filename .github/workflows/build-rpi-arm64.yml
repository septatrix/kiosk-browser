name: Build Raspberry Pi OS arm64 binaries

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.artifact_label }} (arm64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_label: bookworm
            container_image: debian:bookworm
            package_generator: DEB
            package_extension: deb
            package_architecture_arg: -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64
            install_dependencies: |
              apt-get update
              apt-get install -y --no-install-recommends \
                bash \
                build-essential \
                ca-certificates \
                cmake \
                dpkg-dev \
                fakeroot \
                file \
                ninja-build \
                pkg-config \
                qt6-base-dev \
                qt6-declarative-dev \
                qt6-virtualkeyboard-dev \
                qt6-webengine-dev
          - artifact_label: trixie
            container_image: debian:trixie
            package_generator: DEB
            package_extension: deb
            package_architecture_arg: -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=arm64
            install_dependencies: |
              apt-get update
              apt-get install -y --no-install-recommends \
                bash \
                build-essential \
                ca-certificates \
                cmake \
                dpkg-dev \
                fakeroot \
                file \
                ninja-build \
                pkg-config \
                qt6-base-dev \
                qt6-declarative-dev \
                qt6-virtualkeyboard-dev \
                qt6-webengine-dev
          - artifact_label: fedora43
            container_image: fedora:43
            package_generator: RPM
            package_extension: rpm
            package_architecture_arg: ""
            install_dependencies: |
              dnf -y install \
                bash \
                cmake \
                findutils \
                gcc-c++ \
                make \
                ninja-build \
                qt6-qtbase-devel \
                qt6-qtdeclarative-devel \
                qt6-qtvirtualkeyboard-devel \
                qt6-qtwebengine-devel \
                rpm-build
          - artifact_label: fedora44
            container_image: fedora:44
            package_generator: RPM
            package_extension: rpm
            package_architecture_arg: ""
            install_dependencies: |
              dnf -y install \
                bash \
                cmake \
                findutils \
                gcc-c++ \
                make \
                ninja-build \
                qt6-qtbase-devel \
                qt6-qtdeclarative-devel \
                qt6-qtvirtualkeyboard-devel \
                qt6-qtwebengine-devel \
                rpm-build
    container:
      image: ${{ matrix.container_image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          ${{ matrix.install_dependencies }}

      - name: Build and package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${VERSION}" ] || [ "${VERSION}" = "${GITHUB_REF_NAME}" ]; then
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_GENERATOR=${{ matrix.package_generator }} \
            -DCPACK_PACKAGE_VERSION="${VERSION}" \
            ${{ matrix.package_architecture_arg }}

          cmake --build build --parallel
          DESTDIR="${PWD}/stage" cmake --install build
          cpack --config build/CPackConfig.cmake -G ${{ matrix.package_generator }} -B build/packages

          mapfile -t MATCHED_BINARIES < <(find stage/usr/bin -maxdepth 1 -type f -name '*kiosk-browser*' -executable)
          if [ "${#MATCHED_BINARIES[@]}" -ne 1 ]; then
            echo "Error: expected exactly one kiosk-browser executable in stage/usr/bin, found ${#MATCHED_BINARIES[@]}"
            printf '%s\n' "${MATCHED_BINARIES[@]}"
            exit 1
          fi
          cp "${MATCHED_BINARIES[0]}" "build/kiosk-browser-${{ matrix.artifact_label }}-arm64"

      - name: Upload raw binary
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-browser-${{ matrix.artifact_label }}-arm64-binary
          path: build/kiosk-browser-${{ matrix.artifact_label }}-arm64

      - name: Upload package artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-browser-${{ matrix.artifact_label }}-arm64-${{ matrix.package_extension }}
          path: build/packages/*.${{ matrix.package_extension }}
